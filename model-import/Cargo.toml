[package]
name = "model-import"
version = "0.1.0"
edition = "2021"

# Not a Raster program: a host-side tool that turns a model bundle into this
# chain's committed externals. It has no tiles and no `#[sequence] main`.
[[bin]]
name = "model-import"
path = "src/main.rs"

[dependencies]
raster = { path = "../../../raster/crates/raster" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only for the bucket hash. The stage types stay duplicated in `externals.rs`
# (see its header), but the hash must NOT be: it is the one function the host
# and the replay guest have to agree on byte-for-byte, and two copies of it is
# exactly how they would silently drift into different buckets.
prompt-prepare = { path = "../prompt-prepare" }
# Host-side only, and only for `f32_to_act`: the embedding scale must land on the
# exact same Q16.16 bits the reference uses, and the conversion has rounding and
# saturation rules worth not re-deriving. Not linked into any guest.
raster-inference = { path = "../../casettek/raster-inference" }
