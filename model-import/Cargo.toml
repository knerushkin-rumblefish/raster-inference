[package]
name = "model-import"
version = "0.1.0"
edition = "2021"

# Not a Raster program: a host-side tool that turns a model bundle into this
# chain's committed externals. It has no tiles and no `#[sequence] main`.
[[bin]]
name = "model-import"
path = "src/main.rs"

[dependencies]
raster = { path = "../../../raster/crates/raster" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
