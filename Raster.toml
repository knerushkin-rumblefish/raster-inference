inputs.layer = { external = { path = "prefill-prepare-aux/layer2.rastered", index_path = "prefill-prepare-aux/layer2.rindex", commitment = "0f7d73adbb16b1ffe2b8c49cacc70a9970cd306099cd2618d68c29527cbf4b9e" } }

[[chain.stage]]
