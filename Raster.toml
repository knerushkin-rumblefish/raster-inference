# Chain manifest — generated by `model-import` from a Gemma model bundle.
#
# Regenerate (weights, tokenizer and prompt all come from the bundle):
#   cargo run --manifest-path model-import/Cargo.toml -- \
#     --model ../raster-inference/assets/tiny-gemma-dev --prompt "hello raster"
#
# Stage instances are expanded per layer from config.json's num_hidden_layers.

[chain]
name = "raster-chain-inference"
version = "0.1.0"

[[chain.stage]]
name = "prompt_prepare"
project = "prompt-prepare"
inputs.tokenizer = { external = { path = "prompt-prepare/tokenizer.rastered", index_path = "prompt-prepare/tokenizer.rindex", commitment = "1463a243226503380a3ecc9ca4e7c833979b622d74a48873829548326b2b063d" } }
inputs.initial_pieces = { external = { path = "prompt-prepare/initial_pieces.rastered", index_path = "prompt-prepare/initial_pieces.rindex", commitment = "06d581356d7a32bc4fe8b1be3520de2f42096e580c31bf3c421b61c285c6dbc1" } }

[[chain.stage]]
name = "input_embedding"
project = "input-embedding"
inputs.prompt = { from = "prompt_prepare" }
inputs.embedding = { external = { path = "input-embedding/embedding.rastered", index_path = "input-embedding/embedding.rindex", commitment = "95467016fef6b94b5d7967a8e1a5dd8a96faf12be8b0621d7db00cfdecc6e056" } }

[[chain.stage]]
name = "prefill_prepare_aux_l0"
project = "prefill-prepare-aux"
inputs.embedded = { from = "input_embedding" }
inputs.layer = { external = { path = "prefill-prepare-aux/layer0.rastered", index_path = "prefill-prepare-aux/layer0.rindex", commitment = "30d593b25b8c851483d1058f20047102cf921b894c6ef0e5c3b2d93c64373fa9" } }

[[chain.stage]]
name = "prefill_prepare_aux_l1"
