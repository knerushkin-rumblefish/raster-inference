inputs.layer = { external = { path = "prefill-range/layer0.rastered", index_path = "prefill-range/layer0.rindex", commitment = "48a9fb96c3dc534345cfcf7c97c57e5ec5fe2e4b8e293c959da508836e53745f" } }

[[chain.stage]]
name = "prefill_range_l1"
