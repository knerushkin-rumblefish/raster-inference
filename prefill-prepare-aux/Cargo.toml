[package]
name = "prefill-prepare-aux"
version = "0.1.0"
edition = "2021"
default-run = "prefill-prepare-aux"

[features]
default = ["std"]
std = ["raster/std"]
profiling = ["raster/profiling"]

[dependencies]
raster = { path = "../../../raster/crates/raster", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
# Canonical fixed-point kernels, vendored verbatim from the reference.
det-num = { path = "../det-num" }
